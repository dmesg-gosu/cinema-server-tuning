# /etc/sysctl.d/99-performance.conf
# Тюнинг для высоконагруженных серверов с интенсивным I/O и сетевыми нагрузками
# Применить: sysctl -p /etc/sysctl.d/99-performance.conf

# ============ СЕТЬ: TCP БУФЕРЫ И ОПТИМИЗАЦИЯ ============

# Увеличиваем максимальные размеры буферов для TCP (по умолчанию часто 128KB-256KB)
# Для больших файлов и high-bandwidth: 16MB-32MB разумно
net.core.rmem_max = 134217728          # 128MB
net.core.wmem_max = 134217728          # 128MB

# Начальные значения TCP буферов (автоматически масштабируются)
# min:default:max в байтах
net.ipv4.tcp_rmem = 4096 87380 134217728      # 4K:85K:128M
net.ipv4.tcp_wmem = 4096 65536 134217728      # 4K:64K:128M

# Не забываем про UDP буферы (если используется)
net.core.rmem_default = 131072        # 128KB
net.core.wmem_default = 131072        # 128KB

# Алгоритм congestion control для больших пакетов и высоких скоростей
# bbr лучше всего для современных каналов, особенно если потери пакетов
net.ipv4.tcp_congestion_control = bbr

# Включаем TCP Fast Open (сокращает задержку при соединении)
net.ipv4.tcp_fastopen = 3             # 1=клиент, 2=сервер, 3=оба

# ============ NETWORK: ОЧЕРЕДИ И СОЕДИНЕНИЯ ============

# Максимум соединений в listen queue
net.core.somaxconn = 65535

# Максимум полуоткрытых соединений (SYN_RECV)
net.ipv4.tcp_max_syn_backlog = 65535

# Таймауты для соединений
net.ipv4.tcp_fin_timeout = 30
net.ipv4.tcp_keepalive_time = 300

# Включаем TCP timestamps (помогает при перегрузках)
net.ipv4.tcp_timestamps = 1

# Отключаем TCP slow start after idle (для постоянных соединений)
net.ipv4.tcp_slow_start_after_idle = 0

# ============ DISK I/O И ВИРТУАЛЬНАЯ ПАМЯТЬ ============

# Dirty buffers - сколько данных в памяти перед записью на диск
# Для I/O интенсивных приложений: больше dirty = больше буферизации
vm.dirty_ratio = 30                    # 30% RAM в dirty buffers (по умолчанию 20)
vm.dirty_background_ratio = 10         # Начинать писать при 10% (по умолчанию 5)

# Время, после которого dirty данные пишутся на диск
vm.dirty_expire_centisecs = 3000       # 30 сек (по умолчанию 30 сек, хорошо)
vm.dirty_writeback_centisecs = 500     # 5 сек (проверка чаще)

# Swappiness - склонность ОС использовать swap (0-100)
# Для серверов с достаточной памятью - низко (10-20)
vm.swappiness = 10                     # Не трогаем swap, пока есть память

# Если часто OOM killer срабатывает:
vm.panic_on_oom = 0                    # 0 = ждём, не паним

# ============ FILE SYSTEM ============

# Максимум открытых файлов (важно для nginx, postgresql и т.д.)
fs.file-max = 2097152                  # 2M файлов

# Максимум inode watchers (для мониторинга файловой системы)
fs.inotify.max_user_watches = 524288   # 512K watchers

# ============ KERNEL SCHEDULING И ПРОЦЕССЫ ============

# Максимум процессов/потоков
kernel.pid_max = 4194304               # 4M PID

# Scheduler preemption - lower = меньше latency, выше CPU overhead
kernel.sched_preempt = 1               # Full preemption (CFS scheduler)

# Hugepages для больших приложений (если используется)
# vm.nr_hugepages = 2048              # Раскомментировать если нужны hugepages

# ============ SYSRQ键 ============
# Для срочного реагирования при проблемах (осторожно!)
kernel.sysrq = 1                       # 1 = все функции включены

